name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: newsblog, POSTGRES_PASSWORD: newsblog, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U newsblog" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_ADMIN_URL: postgresql://newsblog:newsblog@localhost:5432/postgres
      DATABASE_URL: postgresql://newsblog:newsblog@localhost:5432/postgres
      DIRECT_URL: postgresql://newsblog:newsblog@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end pipeline test (real PostgreSQL, fake AI, local news server)
        run: ./scripts/e2e.sh
      - name: Production build
        run: npx prisma migrate deploy && npm run build
        env: { SESSION_SECRET: ci-session-secret-ci-session-secret-1234, APP_ENCRYPTION_KEY: ci-key }
